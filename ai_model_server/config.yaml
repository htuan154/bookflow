labels: ["SẠCH", "CHỬI BỚI", "KÍCH ĐỘNG", "SPAM"]

# CẤU HÌNH NGƯỠNG (QUAN TRỌNG)
# Logic: "SẠCH" phải cực kỳ chắc chắn mới được công nhận.
# Các nhãn xấu chỉ cần hơi nghi ngờ là bắt ngay.
# config.yaml (Đề xuất sửa đổi)
thresholds:
  "SẠCH": 0.65      # Giảm xuống 0.65 (để câu "Con chó dễ thương" có cơ hội thoát nếu điểm Sạch nó nhích lên tí)
  "CHỬI BỚI": 0.55  # Giữ nguyên hoặc tăng nhẹ để tránh bắt nhầm câu đùa
  "KÍCH ĐỘNG": 0.50 # Hạ xuống chút để bắt được câu "tránh xa ra nhé" (dù điểm thấp)
  "SPAM": 0.50      # Hạ xuống để bắt các câu chứa Link/SĐT (vì hiện tại nó đang bị lọt lưới)

abstain_floor: 0.25 # Nếu không có nhãn nào > 25%, đẩy về REVIEW
temperature: 1.0